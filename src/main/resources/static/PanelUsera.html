<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <nav>
        <div>
            <span>ProjectGym</span>
            <div id="userInfo"></div>
            <button id="wyloguj">Wyloguj</button>
        </div>
    </nav>
    <main>
        <section>
            <h2>Kup lub przedłuż karnet</h2>
            <div>
                <select id="RodzajKarnetu">
                    <option value="MIESIECZNY">Miesięczny (150.00 / 30dni)</option>
                    <option value="STUDENCKI">Studencki (130.00 / 30dni)</option>
                    <option value="ROCZNY">Roczny (1600.00 / 365dni)</option>
                </select>
                <button id="kup">Zatwierdz zakup</button>
            </div>
            <div id="statusWiadomosc"></div>
        </section>
        <section>
            <h2>Twoje karnety</h2>
            <table>
                <thead>
                    <tr>
                        <th>Typ karnetu</th>
                        <th>Cena</th>
                        <th>Ważny od</th>
                        <th>Ważny do</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="karnety">
                    <tr>
                        <td colspan="5">ładowanie historii</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
